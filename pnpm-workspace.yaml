packages:
  - 'apps/*'
  - 'packages/*'

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

catalog:
  '@confect/cli': 10.0.0
  '@confect/core': 10.0.0
  '@confect/react': 10.0.0
  '@confect/server': 10.0.0
  '@confect/test': 10.0.0
  '@effect/atom-react': 4.0.1
  '@effect/platform-node': 4.0.1
  '@effect/tsgo': '0.48.1'
  '@effect/vitest': 4.0.1
  '@t3-oss/env-core': 0.13.11
  '@types/node': 24.19.1
  '@typescript/native': 'npm:typescript@7.0.2'
  convex: 1.46.0
  effect: 4.0.1
  oxlint: 1.86.0
  typescript: 6.0.3
  vitest: 5.0.3

catalogs:
  frontend:
    '@base-ui/utils': '0.4.0'
    '@base-ui/react': 1.8.0
    '@fontsource-variable/nunito-sans': 5.2.7
    '@fontsource-variable/roboto': 5.2.10
    '@tailwindcss/vite': 4.3.3
    '@testing-library/react': 16.3.3
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
    '@uidotdev/usehooks': 2.4.1
    '@vitejs/plugin-react': 6.1.1
    'babel-plugin-react-compiler': 1.0.0
    'class-variance-authority': 0.7.1
    'clsx': 2.1.1
    'jsdom': 30.1.0
    'lucide-react': 1.14.0
    'react': 19.3.0
    'react-dom': 19.3.0
    'shadcn': 4.21.0
    'tailwind-merge': 3.7.0
    'tailwindcss': 4.3.3
    'tw-animate-css': 1.4.0
    vite: 8.3.2

allowBuilds:
  esbuild: true
  sharp: false

# Allow the coordinated Effect and Confect releases through the release-age gate.
minimumReleaseAgeExclude:
  - convex@1.46.0
  - '@confect/cli@10.0.0'
  - '@confect/core@10.0.0'
  - '@confect/react@10.0.0'
  - '@confect/server@10.0.0'
  - '@confect/test@10.0.0'
  - '@effect/atom-react@4.0.1'
  - '@effect/platform-node@4.0.1'
  - '@effect/vitest@4.0.1'
  - effect@4.0.1
  - '@effect/tsgo-darwin-arm64@0.48.1'
  - '@effect/tsgo-darwin-x64@0.48.1'
  - '@effect/tsgo-linux-arm64@0.48.1'
  - '@effect/tsgo-linux-arm@0.48.1'
  - '@effect/tsgo-linux-x64@0.48.1'
  - '@effect/tsgo-win32-arm64@0.48.1'
  - '@effect/tsgo-win32-x64@0.48.1'
  - '@effect/tsgo@0.48.1'
